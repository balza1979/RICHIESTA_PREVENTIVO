<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Richiesta Preventivo</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f0f0f0;
        font-size: 22px;
    }

    h1 {
        text-align: center;
        font-size: 32px;
        margin-bottom: 25px;
    }

    .box {
        background: white;
        padding: 30px;
        margin: 0 auto;
        max-width: 900px;
        width: 100%;
        border-radius: 20px;
        box-shadow: 0 0 20px #aaa;
    }

    label {
        font-weight: bold;
        font-size: 24px;
    }

    input, textarea {
        width: 100%;
        margin-top: 10px;
        margin-bottom: 25px;
        padding: 15px;
        border-radius: 10px;
        border: 2px solid #666;
        font-size: 22px;
    }

    input[type=file] {
        padding: 10px;
        font-size: 20px;
    }

    .button {
        width: 100%;
        background: #0078D7;
        color: white;
        padding: 20px;
        text-align: center;
        border-radius: 15px;
        cursor: pointer;
        font-size: 26px;
        font-weight: bold;
        border: none;
        margin-top: 10px;
        margin-bottom: 10px;
    }

    .button:hover {
        background: #005A9E;
    }

    .preview-img {
        max-width: 100%;
        margin-bottom: 25px;
        display: none;
        border-radius: 10px;
        border: 2px solid #aaa;
    }

    @media only screen and (max-width: 600px) {
        body {
            font-size: 24px;
        }

        h1 {
            font-size: 36px;
        }

        .box {
            padding: 25px;
        }

        input, textarea {
            font-size: 24px;
            padding: 18px;
        }

        label {
            font-size: 26px;
        }

        .button {
            font-size: 30px;
            padding: 25px;
        }
    }
</style>

</head>
<body>

<h1>Richiesta Preventivo</h1>

<div class="box">

    <label>ID Richiesta *</label>
    <input type="text" id="txtID" placeholder="Es. ID000123">

    <label>Nome Richiedente *</label>
    <input type="text" id="txtNome" placeholder="Il tuo nome">

    <label>Schede richieste *</label>
    <input type="text" id="txtSchede" placeholder="Es. Scheda A, B, C">

    <label>Descrizione richiesta *</label>
    <textarea id="txtDescrizione" rows="4" placeholder="Inserisci la descrizione"></textarea>

    <label>Foto targhetta quadro</label>
    <input type="file" id="fileTarghetta" accept="image/*">
    <img id="previewTarghetta" class="preview-img">

    <label>Foto dispositivo</label>
    <input type="file" id="fileDispositivo" accept="image/*">
    <img id="previewDispositivo" class="preview-img">

    <button class="button" id="btnInvia">INVIA RICHIESTA PREVENTIVO</button>

</div>

<script>
// --- MOSTRA PREVIEW FOTO ---
function previewFile(input, imgPreview) {
    input.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            imgPreview.style.display = "block";
            imgPreview.src = URL.createObjectURL(file);
        }
    });
}

previewFile(document.getElementById("fileTarghetta"), document.getElementById("previewTarghetta"));
previewFile(document.getElementById("fileDispositivo"), document.getElementById("previewDispositivo"));

// --- INVIO EMAIL ---
document.getElementById("btnInvia").onclick = function () {

    let id = document.getElementById("txtID").value;
    let schede = document.getElementById("txtSchede").value;
    let descrizione = document.getElementById("txtDescrizione").value;
    let nome = document.getElementById("txtNome").value;

    // verifica obbligatori
    if (id === "" || schede === "" || descrizione === "" || nome === "") {
        alert("Compila tutti i campi obbligatori!");
        return;
    }

    let oggetto = encodeURIComponent("Richiesta Preventivo - " + id);

    let corpo = encodeURIComponent(
        "ID: " + id + "%0A" +
        "Richiedente: " + nome + "%0A" +
        "Schede richieste: " + schede + "%0A" +
        "Descrizione: " + descrizione + "%0A%0A" +
        "*** Nota: allegare manualmente le foto alla mail se presenti. ***"
    );

    let mailtoLink = "mailto:p.mazzucchelli@elmi-srl.it?subject=" + oggetto + "&body=" + corpo;

    window.location.href = mailtoLink;
};
</script>

</body>
</html>
