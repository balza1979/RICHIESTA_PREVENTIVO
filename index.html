<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f0f0f0;
        font-size: 22px; /* GRANDE */
    }

    h1 {
        text-align: center;
        font-size: 32px;  /* TITOLO PIÙ GRANDE */
        margin-bottom: 25px;
    }

    .box {
        background: white;
        padding: 30px;
        margin: 0 auto;
        max-width: 900px;        /* PIÙ LARGO */
        width: 100%;
        border-radius: 20px;
        box-shadow: 0 0 20px #aaa;
    }

    label {
        font-weight: bold;
        font-size: 24px; /* ETICHETTE GRANDI */
    }

    input, textarea {
        width: 100%;
        margin-top: 10px;
        margin-bottom: 25px;
        padding: 15px;
        border-radius: 10px;
        border: 2px solid #666;
        font-size: 22px;  /* TESTO GRANDE */
    }

    input[type=file] {
        padding: 10px;
        font-size: 20px;
    }

    .button {
        width: 100%;
        background: #0078D7;
        color: white;
        padding: 20px;
        text-align: center;
        border-radius: 15px;
        cursor: pointer;
        font-size: 26px; /* PULSANTE ENORME */
        font-weight: bold;
        border: none;
        margin-top: 10px;
        margin-bottom: 10px;
    }

    .button:hover {
        background: #005A9E;
    }

    .preview-img {
        max-width: 100%;
        margin-bottom: 25px;
        display: none;
        border-radius: 10px;
        border: 2px solid #aaa;
    }

    /* VERSIONE MOBILE PERFETTA */
    @media only screen and (max-width: 600px) {
        body {
            font-size: 24px;
        }

        h1 {
            font-size: 36px;
        }

        .box {
            padding: 25px;
        }

        input, textarea {
            font-size: 24px;
            padding: 18px;
        }

        label {
            font-size: 26px;
        }

        .button {
            font-size: 30px;
            padding: 25px;
        }
    }
</style>
