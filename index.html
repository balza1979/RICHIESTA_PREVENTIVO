<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Richiesta Preventivo</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f0f0f0;
        font-size: 40px;
    }

    h1 {
        text-align: center;
        font-size: 55px;
        margin-bottom: 35px;
    }

    .box {
        background: white;
        padding: 40px;
        margin: 0 auto;
        max-width: 850px;
        width: 100%;
        border-radius: 25px;
        box-shadow: 0 0 25px #aaa;
    }

    label {
        font-weight: bold;
        font-size: 45px;
    }

    input, textarea {
        width: 100%;
        margin-top: 15px;
        margin-bottom: 35px;
        padding: 22px;
        border-radius: 15px;
        border: 3px solid #666;
        font-size: 40px;
    }

    #txtID {
        max-width: 350px;
    }

    textarea {
        height: 250px;
    }

    #txtSchede {
        height: 180px;
        resize: none;
        font-size: 40px;
        padding: 25px;
        line-height: 1.3;
    }

    .button {
        width: 100%;
        background: #0078D7;
        color: white;
        padding: 30px;
        text-align: center;
        border-radius: 20px;
        cursor: pointer;
        font-size: 48px;
        font-weight: bold;
        border: none;
        margin-top: 20px;
        margin-bottom: 10px;
    }

    .button:hover {
        background: #005A9E;
    }

    .button-group {
        margin-top: 10px;
        margin-bottom: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
    }

    .miniBtn {
        background: #444;
        color: white;
        padding: 18px 25px;
        font-size: 32px;
        border-radius: 15px;
        border: none;
        cursor: pointer;
        flex-grow: 1;
    }

    .miniBtn:hover {
        background: #000;
    }

    @media only screen and (max-width: 600px) {
        body { font-size: 50px; }
        h1 { font-size: 65px; }
        input, textarea { font-size: 50px; padding: 30px; }
        label { font-size: 55px; }
        .button { font-size: 60px; padding: 35px; }
    }
</style>

</head>
<body>

<h1>Richiesta Preventivo</h1>

<div class="box">

<!-- 1. ID -->
<div>
    <label>ID Richiesta *</label>
    <input type="text" id="txtID" maxlength="10" placeholder="Es. 12345">
</div>

<!-- 2. Nome -->
<div>
    <label>Nome Richiedente *</label>
    <input type="text" id="txtNome" placeholder="Il tuo nome">
</div>

<!-- 3. Telefono (NON obbligatorio) -->
<div>
    <label>Numero telefonico di riferimento (opzionale)</label>
    <input type="text" id="txtTelefono" placeholder="Telefono">
</div>

<!-- 4. Descrizione -->
<label>Descrivere il problema *</label>
<textarea id="txtDescrizione" placeholder="Inserisci la descrizione del problema"></textarea>

<!-- 5. Pulsanti schede -->
<label>Schede richieste *</label>

<div class="button-group">
    <button type="button" class="miniBtn" data-value="KIT SCHEDE MANOVRA">KIT SCHEDE MANOVRA</button>
    <button type="button" class="miniBtn" data-value="SCHEDA EMERGENZA">SCHEDA EMERGENZA</button>
    <button type="button" class="miniBtn" data-value="PROGRAMMATORE">PROGRAMMATORE</button>
    <button type="button" class="miniBtn" data-value="SCHEDA QUADRO">SCHEDA QUADRO</button>
    <button type="button" class="miniBtn" data-value="SCHEDA CABINA">SCHEDA CABINA</button>
</div>

<!-- 6. Campo schede -->
<textarea id="txtSchede" placeholder="Seleziona le schede dai pulsanti sopra"></textarea>

<button class="button" id="btnInvia">INVIA RICHIESTA PREVENTIVO</button>

</div>

<script>
// --- PULSANTI RAPIDI ---
document.querySelectorAll(".miniBtn").forEach(btn => {
    btn.addEventListener("click", function () {

        let campo = document.getElementById("txtSchede");
        let valore = "• " + this.dataset.value;

        if (campo.value.trim() === "") {
            campo.value = valore;
        } else {
            campo.value += "\n" + valore;
        }

        campo.focus();
    });
});


// --- INVIO EMAIL ---
document.getElementById("btnInvia").onclick = function () {

    let id = document.getElementById("txtID").value;
    let schede = document.getElementById("txtSchede").value;
    let descrizione = document.getElementById("txtDescrizione").value;
    let nome = document.getElementById("txtNome").value;
    let telefono = document.getElementById("txtTelefono").value;

    if (id === "" || schede === "" || descrizione === "" || nome === "") {
        alert("Compila tutti i campi obbligatori!");
        return;
    }

    let oggetto = encodeURIComponent("Richiesta Preventivo - " + id);

    let corpo = encodeURIComponent(
        "ID: " + id + "%0D%0A" +
        "Richiedente: " + nome + "%0D%0A" +
        (telefono ? "Telefono: " + telefono + "%0D%0A" : "") +
        "%0D%0A" +
        "Schede richieste:" + "%0D%0A" +
        schede.replace(/\n/g, "%0D%0A") + "%0D%0A%0D%0A" +
        "Problema segnalato: " + descrizione + "%0D%0A"
    );

    let mailtoLink = "mailto:l.balzanelli@elmi-srl.it?subject=" + oggetto + "&body=" + corpo;

    window.location.href = "avviso.html?link=" + encodeURIComponent(mailtoLink);
};
</script>

</body>
</html>
