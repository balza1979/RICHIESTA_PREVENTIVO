<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Richiesta Preventivo</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f0f0f0;
        font-size: 40px; /* FONT MOLTO GRANDE */
    }

    h1 {
        text-align: center;
        font-size: 55px;
        margin-bottom: 35px;
    }

    .box {
        background: white;
        padding: 40px;
        margin: 0 auto;
        max-width: 850px;
        width: 100%;
        border-radius: 25px;
        box-shadow: 0 0 25px #aaa;
    }

    label {
        font-weight: bold;
        font-size: 45px;
    }

    input, textarea {
        width: 100%;
        margin-top: 15px;
        margin-bottom: 35px;
        padding: 22px;
        border-radius: 15px;
        border: 3px solid #666;
        font-size: 40px;
    }

    /* CAMPO ID PIÙ CORTO VISIVAMENTE */
    #txtID {
        max-width: 350px;
    }

    textarea {
        height: 250px;
    }

    input[type=file] {
        padding: 12px;
        font-size: 35px;
    }

    .button {
        width: 100%;
        background: #0078D7;
        color: white;
        padding: 30px;
        text-align: center;
        border-radius: 20px;
        cursor: pointer;
        font-size: 48px;
        font-weight: bold;
        border: none;
        margin-top: 20px;
        margin-bottom: 10px;
    }

    .button-group {
    margin-top: 10px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

.miniBtn {
    background: #444;
    color: white;
    padding: 18px 25px;
    font-size: 32px;
    border-radius: 15px;
    border: none;
    cursor: pointer;
    flex-grow: 1;
}

.miniBtn:hover {
    background: #000;
}
    .button:hover {
        background: #005A9E;
    }

    .preview-img {
        max-width: 100%;
        margin-bottom: 35px;
        display: none;
        border-radius: 15px;
        border: 3px solid #aaa;
    }

    /* Versione mobile ancora più grande */
    @media only screen and (max-width: 600px) {
        body {
            font-size: 50px;
        }

        h1 {
            font-size: 65px;
        }

        input, textarea {
            font-size: 50px;
            padding: 30px;
        }

        label {
            font-size: 55px;
        }

        .button {
            font-size: 60px;
            padding: 35px;
        }
    }
</style>

</head>
<body>

<h1>Richiesta Preventivo</h1>

<div class="box">
<div>
    <label>ID Richiesta *</label>
    <input type="text" id="txtID" maxlength="10" placeholder="Es. 12345">
</div>

<div>
    <label>Nome Richiedente *</label>
    <input type="text" id="txtNome" placeholder="Il tuo nome">
</div>

    <label>Schede richieste *</label>
<div class="button-group">
    <button type="button" class="miniBtn" data-value="KIT SCHEDE MANOVRA">KIT SCHEDE MANOVRA</button>
    <button type="button" class="miniBtn" data-value="SCHEDA EMERGENZA">SCHEDA EMERGENZA</button>
    <button type="button" class="miniBtn" data-value="PROGRAMMATORE">PROGRAMMATORE</button>
    <button type="button" class="miniBtn" data-value="SCHEDA QUADRO">SCHEDA QUADRO</button>
    <button type="button" class="miniBtn" data-value="SCHEDA CABINA">SCHEDA CABINA</button>
</div>


    
    <input type="text" id="txtSchede" placeholder="Es. A, B, C">

    <label>Descrizione richiesta *</label>
    <textarea id="txtDescrizione" placeholder="Inserisci la descrizione"></textarea>

    <label>Foto targhetta quadro</label>
    <input type="file" id="fileTarghetta" accept="image/*">
    <img id="previewTarghetta" class="preview-img">

    <label>Foto dispositivo</label>
    <input type="file" id="fileDispositivo" accept="image/*">
    <img id="previewDispositivo" class="preview-img">

    <button class="button" id="btnInvia">INVIA RICHIESTA PREVENTIVO</button>

</div>

<script>
// --- PREVIEW FOTO ---
function previewFile(input, imgPreview) {
    input.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            imgPreview.style.display = "block";
            imgPreview.src = URL.createObjectURL(file);
        }
    });
}

previewFile(document.getElementById("fileTarghetta"), document.getElementById("previewTarghetta"));
previewFile(document.getElementById("fileDispositivo"), document.getElementById("previewDispositivo"));

// --- INVIO EMAIL ---
document.getElementById("btnInvia").onclick = function () {

    let id = document.getElementById("txtID").value;
    let schede = document.getElementById("txtSchede").value;
    let descrizione = document.getElementById("txtDescrizione").value;
    let nome = document.getElementById("txtNome").value;

    // obbligatori
    if (id === "" || schede === "" || descrizione === "" || nome === "") {
        alert("Compila tutti i campi obbligatori!");
        return;
    }

    let oggetto = encodeURIComponent("Richiesta Preventivo - " + id);

    // puoi modificare la formattazione come vuoi
   let corpo = encodeURIComponent(
    "ID: " + id + "%0D%0A" +
    "Richiedente: " + nome + "%0D%0A" +
    "Schede richieste: " + schede + "%0D%0A" +
    "Descrizione: " + descrizione + "%0D%0A" 
     
);

    // tua email
    let mailtoLink = "mailto:l.balzanelli@elmi-srl.it?subject=" + oggetto + "&body=" + corpo;

    window.location.href = "avviso.html?link=" + encodeURIComponent(mailtoLink);

};
    // --- Pulsanti per compilazione rapida delle schede ---
document.querySelectorAll(".miniBtn").forEach(btn => {
    btn.addEventListener("click", function () {

        let campo = document.getElementById("txtSchede");

        // Se vuoto → inserisci solo il valore cliccato
        if (campo.value.trim() === "") {
            campo.value = this.dataset.value;
        } 
        // Se già compilato → aggiungi separato da virgola
        else {
            campo.value += ", " + this.dataset.value;
        }
    });
});
</script>

</body>
</html>
